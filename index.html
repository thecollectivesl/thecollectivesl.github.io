<!DOCTYPE html>
<html>
<head>
    <title>The Collective</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 80px;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 52px;
            font-weight: 700;
            color: #ffffff;
            text-align: center;
            -webkit-text-stroke: 1px #00ff00; /* thin green outline */
            letter-spacing: 3px;
            margin: 0 0 20px 0;
        }

        p {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            color: #ffffff;
            text-align: center;
            -webkit-text-stroke: 0.8px #00ff00;
            letter-spacing: 2px;
            margin: 0;
        }
    </style>
</head>
<body>
    <h1>Welcome To The Collective</h1>
    <p>under construction</p>
</body>
</html>
