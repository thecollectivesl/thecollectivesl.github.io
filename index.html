<!DOCTYPE html>
<html>
<head>
    <title>The Collective</title>
    <style>
        @font-face {
            font-family: 'AlienResurrection';
            src: url('AlienResurrection.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            background-color: #000000;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 80px;
            font-family: 'AlienResurrection', sans-serif;
            color: white;
        }

        h1 {
            font-family: 'AlienResurrection', sans-serif;
            font-size: 52px;
            font-weight: normal;
            color: #ffffff;
            text-align: center;
            -webkit-text-stroke: 1px #00ff00;
            letter-spacing: 3px;
            margin: 0 0 20px 0;
        }

        .subtitle {
            font-family: 'AlienResurrection', sans-serif;
            font-size: 24px;
            color: #ffffff;
            text-align: center;
            -webkit-text-stroke: 0.8px #00ff00;
            letter-spacing: 2px;
            margin: 0 0 50px 0;
        }

        .player {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        #playBtn {
            background-color: transparent;
            border: 2px solid #00ff00;
            color: white;
            font-family: 'AlienResurrection', sans-serif;
            font-size: 20px;
            padding: 12px 40px;
            cursor: pointer;
            letter-spacing: 2px;
            text-decoration: none;
            transition: all 0.3s;
            -webkit-text-stroke: 0.5px #00ff00;
        }

        #playBtn:hover {
            background-color: #00ff00;
            color: black;
            -webkit-text-stroke: 0;
        }
    </style>
</head>
<body>

    <h1>Welcome  To  The  Collective</h1>
    <p class="subtitle">under  construction</p>

    <div class="player">
        <a id="playBtn" href="http://uuan-treves.go-stream.live:8973/stream" target="_blank">
            Listen  Now
        </a>
    </div>

</body>
</html>
