<!DOCTYPE html>
<html>
<head>
    <title>The Collective</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 80px;
            font-family: 'Orbitron', sans-serif;
            color: white;
        }

        h1 {
            font-size: 52px;
            font-weight: 700;
            color: #ffffff;
            text-align: center;
            -webkit-text-stroke: 1px #00ff00;
            letter-spacing: 3px;
            margin: 0 0 20px 0;
        }

        .subtitle {
            font-size: 24px;
            color: #ffffff;
            text-align: center;
            -webkit-text-stroke: 0.8px #00ff00;
            letter-spacing: 2px;
            margin: 0 0 50px 0;
        }

        .player {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        #playBtn {
            background-color: transparent;
            border: 2px solid #00ff00;
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            padding: 12px 40px;
            cursor: pointer;
            letter-spacing: 2px;
            transition: all 0.3s;
            -webkit-text-stroke: 0.5px #00ff00;
        }

        #playBtn:hover {
            background-color: #00ff00;
            color: black;
            -webkit-text-stroke: 0;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 16px;
        }

        input[type="range"] {
            width: 180px;
            accent-color: #00ff00;
        }
    </style>
</head>
<body>

    <h1>Welcome To The Collective</h1>
    <p class="subtitle">under construction</p>

    <div class="player">
        <button id="playBtn">Listen Now</button>

        <div class="volume-control">
            <span>Volume</span>
            <input type="range" id="volume" min="0" max="1" step="0.01" value="0.7">
        </div>
    </div>

    <audio id="stream" src="http://uuan-treves.go-stream.live:8973/stream" preload="none"></audio>

    <script>
        const audio = document.getElementById('stream');
        const playBtn = document.getElementById('playBtn');
        const volumeSlider = document.getElementById('volume');

        let isPlaying = false;

        playBtn.addEventListener('click', () => {
            if (isPlaying) {
                audio.pause();
                playBtn.textContent = 'Listen Now';
            } else {
                audio.play();
                playBtn.textContent = 'Pause';
            }
            isPlaying = !isPlaying;
        });

        volumeSlider.addEventListener('input', () => {
            audio.volume = volumeSlider.value;
        });

        // Set initial volume
        audio.volume = 0.7;
    </script>

</body>
</html>
